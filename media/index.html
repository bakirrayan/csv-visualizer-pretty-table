<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} https: http: data:;">
  <title>CSV Visualizer</title>
  <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>CSV Visualizer</h1>
      <div class="subtitle">Advanced data exploration and filtering</div>
    </div>

    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-label">Total Rows</div>
        <div class="stat-value" id="totalRows">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Visible Rows</div>
        <div class="stat-value" id="visibleRows">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Columns</div>
        <div class="stat-value" id="totalColumns">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Visible Columns</div>
        <div class="stat-value" id="visibleColumns">0</div>
      </div>
    </div>

    <div class="toggle-section">
      <div class="toggle-header" id="columnConfigToggle">
        <div class="toggle-title">Column Configuration</div>
        <div class="toggle-icon" id="columnConfigIcon">&#9654;</div>
      </div>
      <div class="toggle-content" id="columnConfigContent">
        <div class="select-all-columns-bar">
          <input type="checkbox" id="selectAllColumns">
          <label for="selectAllColumns">Select/Deselect All Columns</label>
        </div>
        <div class="column-config" id="columnConfig"></div>
      </div>
    </div>

    <div class="select-all-rows">
      <input type="checkbox" id="selectAllRowsCheckbox" class="row-select-checkbox">
      <label for="selectAllRowsCheckbox">Select All Rows (<span id="selectedRowCount">0</span> selected)</label>
      <button id="clearSelectionBtn">Clear Selection</button>
      <button class="primary" id="copySelectedBtn">Copy Selected</button>
    </div>

    <div class="controls">
      <div class="control-row">
        <div class="control-group">
          <label for="globalSearch">Global Search</label>
          <input type="text" id="globalSearch" placeholder="Search across all columns...">
        </div>
        <div class="control-group">
          <label for="rowsPerPage">Rows Per Page</label>
          <select id="rowsPerPage">
            <option value="10">10 rows</option>
            <option value="25" selected>25 rows</option>
            <option value="50">50 rows</option>
            <option value="100">100 rows</option>
            <option value="250">250 rows</option>
            <option value="500">500 rows</option>
            <option value="all">All rows</option>
          </select>
        </div>
        <div class="control-group">
          <label class="spacer">&nbsp;</label>
          <button class="danger" id="clearFiltersBtn">Clear All Filters</button>
        </div>
      </div>
    </div>

    <div class="table-container">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="pagination">
      <div class="pagination-info" id="paginationInfo"></div>
      <div class="pagination-controls">
        <button data-page-action="first">First</button>
        <button data-page-action="prev">Previous</button>
        <input type="number" id="pageInput" class="page-input" min="1" value="1">
        <button data-page-action="go">Go</button>
        <button data-page-action="next">Next</button>
        <button data-page-action="last">Last</button>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal">
    <div class="lightbox-header">
      <div class="lightbox-title" id="lightboxTitle">Image Gallery</div>
      <button class="lightbox-close" id="lightboxClose">&#10007; Close</button>
    </div>

    <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>

    <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&lsaquo;</button>

    <div class="lightbox-content" id="lightboxContent">
      <img class="lightbox-image" id="lightboxImage" src="" alt="Full size image">
    </div>

    <button class="lightbox-nav lightbox-next" id="lightboxNext">&rsaquo;</button>

    <div class="lightbox-thumbnails" id="lightboxThumbnails"></div>
  </div>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
