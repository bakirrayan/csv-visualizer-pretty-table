<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#13131f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c6af7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d5ae6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9370f5;stop-opacity:1" />
    </linearGradient>
    <clipPath id="rounded">
      <rect width="128" height="128" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" ry="24" fill="url(#bg)"/>

  <!-- Table card shadow -->
  <rect x="14" y="20" width="100" height="90" rx="10" ry="10" fill="#0d0d1a" opacity="0.5"/>

  <!-- Table card -->
  <rect x="12" y="18" width="100" height="90" rx="10" ry="10" fill="#1a1a2e"/>
  <rect x="12" y="18" width="100" height="90" rx="10" ry="10" fill="none" stroke="#2e2e4a" stroke-width="1"/>

  <!-- Header row -->
  <rect x="12" y="18" width="100" height="22" rx="10" ry="10" fill="url(#header)"/>
  <rect x="12" y="30" width="100" height="10" fill="url(#header)"/>

  <!-- Header text bars -->
  <rect x="20" y="25" width="18" height="5" rx="2.5" fill="white" opacity="0.9"/>
  <rect x="47" y="25" width="22" height="5" rx="2.5" fill="white" opacity="0.9"/>
  <rect x="78" y="25" width="16" height="5" rx="2.5" fill="white" opacity="0.9"/>
  <rect x="103" y="25" width="5" height="5" rx="2.5" fill="white" opacity="0.6"/>

  <!-- Column dividers -->
  <line x1="43" y1="18" x2="43" y2="108" stroke="#2e2e4a" stroke-width="1" opacity="0.8"/>
  <line x1="74" y1="18" x2="74" y2="108" stroke="#2e2e4a" stroke-width="1" opacity="0.8"/>
  <line x1="99" y1="18" x2="99" y2="108" stroke="#2e2e4a" stroke-width="1" opacity="0.8"/>

  <!-- Row 1 -->
  <rect x="20" y="46" width="14" height="4" rx="2" fill="#a78bfa" opacity="0.8"/>
  <rect x="52" y="46" width="12" height="4" rx="2" fill="#6e6e8e" opacity="0.7"/>
  <rect x="80" y="46" width="10" height="4" rx="2" fill="#6e6e8e" opacity="0.7"/>
  <rect x="102" y="44" width="8" height="8" rx="4" fill="#34d399" opacity="0.9"/>

  <!-- Row divider 1 -->
  <line x1="12" y1="56" x2="112" y2="56" stroke="#2e2e4a" stroke-width="1" opacity="0.6"/>

  <!-- Row 2 (highlighted) -->
  <rect x="12" y="57" width="100" height="14" fill="#7c6af7" opacity="0.12"/>
  <rect x="20" y="61" width="17" height="4" rx="2" fill="#a78bfa" opacity="0.9"/>
  <rect x="50" y="61" width="14" height="4" rx="2" fill="#6e6e8e" opacity="0.7"/>
  <rect x="79" y="61" width="11" height="4" rx="2" fill="#6e6e8e" opacity="0.7"/>
  <rect x="102" y="59" width="8" height="8" rx="4" fill="#f87171" opacity="0.9"/>

  <!-- Row divider 2 -->
  <line x1="12" y1="71" x2="112" y2="71" stroke="#2e2e4a" stroke-width="1" opacity="0.6"/>

  <!-- Row 3 -->
  <rect x="20" y="76" width="12" height="4" rx="2" fill="#a78bfa" opacity="0.8"/>
  <rect x="53" y="76" width="10" height="4" rx="2" fill="#6e6e8e" opacity="0.7"/>
  <rect x="80" y="76" width="13" height="4" rx="2" fill="#6e6e8e" opacity="0.7"/>
  <rect x="102" y="74" width="8" height="8" rx="4" fill="#34d399" opacity="0.9"/>

  <!-- Row divider 3 -->
  <line x1="12" y1="86" x2="112" y2="86" stroke="#2e2e4a" stroke-width="1" opacity="0.6"/>

  <!-- Row 4 (faded/partial) -->
  <rect x="20" y="91" width="15" height="4" rx="2" fill="#a78bfa" opacity="0.5"/>
  <rect x="51" y="91" width="11" height="4" rx="2" fill="#6e6e8e" opacity="0.4"/>
  <rect x="80" y="91" width="9" height="4" rx="2" fill="#6e6e8e" opacity="0.4"/>
  <rect x="102" y="89" width="8" height="8" rx="4" fill="#fbbf24" opacity="0.7"/>

  <!-- Magnifier overlay (search/inspect feel) -->
  <circle cx="97" cy="97" r="18" fill="#13131f" opacity="0.9"/>
  <circle cx="97" cy="97" r="17" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <circle cx="94" cy="94" r="7" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <line x1="99" y1="99" x2="105" y2="105" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
